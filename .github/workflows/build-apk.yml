name: Build APK

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that all levels are beatable
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/verify.js
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: claude-dash-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK next to the web version
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: android/app/build/outputs/apk/debug
          destination_dir: apk
          publish_branch: gh-pages
          keep_files: true
          exclude_assets: 'output-metadata.json'
