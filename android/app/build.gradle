plugins {
    id 'com.android.application'
}

android {
    namespace 'com.motyasolik.claudedash'
    compileSdk 34

    defaultConfig {
        applicationId 'com.motyasolik.claudedash'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // the whole game lives in /web — it is packaged as the app's assets
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sideload-friendly: signed with the debug key
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
